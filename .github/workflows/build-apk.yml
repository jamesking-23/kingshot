name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, assemble
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      # Failure details as annotations (readable via the checks API even when job logs are not).
      - name: Annotate failure (1/3)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed|AAPT|Caused by" build.log | sed -n '1,10p' | while IFS= read -r l; do
            l="${l//%/ pct }"
            echo "::error::${l:0:380}"
          done

      - name: Annotate failure (2/3)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed|AAPT|Caused by" build.log | sed -n '11,20p' | while IFS= read -r l; do
            l="${l//%/ pct }"
            echo "::error::${l:0:380}"
          done

      - name: Annotate failure (3/3)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed|AAPT|Caused by" build.log | sed -n '21,30p' | while IFS= read -r l; do
            l="${l//%/ pct }"
            echo "::error::${l:0:380}"
          done

      - name: Privacy gate - merged manifest must not request INTERNET
        run: |
          M=$(find app/build -path '*merged_manifest*' -name AndroidManifest.xml | head -n1)
          echo "Checking $M"
          test -n "$M"
          if grep -q 'android.permission.INTERNET' "$M"; then
            echo "FAIL: INTERNET permission found in merged manifest"; exit 1
          fi
          echo "Permissions declared:"; grep -o 'uses-permission[^/]*' "$M"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build.log
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: KingShot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
