name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, assemble
        shell: bash
        run: |
          set -o pipefail
          ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      # Failure details as annotations (readable via the checks API even when job logs are not).
      - name: Annotate failure (1/3)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|Lint error|\\.kt:[0-9]+:[0-9]+|FAILED|What went wrong|Execution failed|AAPT|Caused by" build.log | sed -n '1,10p' | while IFS= read -r l; do
            l="${l//%/ pct }"
            echo "::error::${l:0:380}"
          done

      - name: Annotate failure (2/3)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|Lint error|\\.kt:[0-9]+:[0-9]+|FAILED|What went wrong|Execution failed|AAPT|Caused by" build.log | sed -n '11,20p' | while IFS= read -r l; do
            l="${l//%/ pct }"
            echo "::error::${l:0:380}"
          done

      - name: Annotate failure (3/3)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|Lint error|\\.kt:[0-9]+:[0-9]+|FAILED|What went wrong|Execution failed|AAPT|Caused by" build.log | sed -n '21,30p' | while IFS= read -r l; do
            l="${l//%/ pct }"
            echo "::error::${l:0:380}"
          done

      - name: Annotate dependency issues
        if: failure()
        shell: bash
        run: |
          grep -E "Dependency '|requires|compileSdk|Android Gradle plugin|minCompileSdk|minAgp" build.log | sort -u | sed -n '1,14p' | while IFS= read -r l; do
            l="${l//%/ pct }"
            echo "::error::${l:0:380}"
          done

      - name: Privacy gate - merged manifest may declare only the allowed permissions
        run: |
          M=$(find app/build -path '*merged_manifest*' -name AndroidManifest.xml | head -n1)
          echo "Checking $M"
          test -n "$M"
          python3 - "$M" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = '{http://schemas.android.com/apk/res/android}name'
          allowed = {
              'android.permission.CAMERA',
              'android.permission.INTERNET',                 # update check started by the user (ADR 0007)
              'android.permission.REQUEST_INSTALL_PACKAGES', # installing the downloaded update
          }
          found = [e.get(ns) for e in ET.parse(sys.argv[1]).getroot().iter('uses-permission')]
          print('Permissions declared:', found)
          bad = [p for p in found if p not in allowed and not p.endswith('.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION')]
          if bad:
              print('FAIL: unexpected permissions:', bad)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build.log
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: KingShot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
