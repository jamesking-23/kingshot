name: Release

# Publishes a signed APK as a GitHub Release when a version tag is pushed (git tag v0.5.0 && git push origin v0.5.0).
# Needs the repository secret KS_PASSWORD (see docs/RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing secret present
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          if [ -z "$KS_PASSWORD" ]; then
            echo "::error::Repository secret KS_PASSWORD is missing, so the release cannot be signed. See docs/RELEASING.md."
            exit 1
          fi

      - name: Tag must match versionName
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $V in app/build.gradle.kts"
            exit 1
          fi

      - name: Lint, unit tests, assemble signed release
        shell: bash
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256 digest" | head -n1

      - name: Package
        run: |
          cp app/build/outputs/apk/release/app-release.apk "KingShot-$VERSION.apk"
          sha256sum "KingShot-$VERSION.apk" > "KingShot-$VERSION.apk.sha256"
          cat "KingShot-$VERSION.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "KingShot $VERSION"
            echo
            echo "Install: download KingShot-$VERSION.apk below, or in the app open Settings, Updates, Check for updates."
            echo "Checksum: KingShot-$VERSION.apk.sha256 (the app verifies it before installing)."
            echo "Built from commit $GITHUB_SHA. See CHANGELOG.md for what changed."
            echo "Not yet verified on every device; see docs/VALIDATION_LOG.md."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "KingShot-$VERSION.apk" "KingShot-$VERSION.apk.sha256" --title "KingShot $VERSION" --notes-file notes.md
