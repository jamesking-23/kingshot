name: Release

# Publishes a signed APK as a GitHub Release when a version tag is pushed (git tag v0.5.0 && git push origin v0.5.0),
# or when run by hand from the Actions tab with the tag to build ("Run workflow", type the tag, e.g. v0.5.0).
# If the release page already exists (for example created in the web UI), the files are attached to it.
# Needs the repository secret KS_PASSWORD (see docs/RELEASING.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v0.5.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing secret present
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          if [ -z "$KS_PASSWORD" ]; then
            echo "::error::Repository secret KS_PASSWORD is missing, so the release cannot be signed. See docs/RELEASING.md."
            exit 1
          fi

      - name: Tag must match versionName
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [ "v$V" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $V in app/build.gradle.kts"
            exit 1
          fi

      - name: Lint, unit tests, assemble signed release
        shell: bash
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256 digest" | head -n1

      - name: Package
        run: |
          cp app/build/outputs/apk/release/app-release.apk "KingShot-$VERSION.apk"
          sha256sum "KingShot-$VERSION.apk" > "KingShot-$VERSION.apk.sha256"
          cat "KingShot-$VERSION.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "KingShot $VERSION"
            echo
            echo "Install: download KingShot-$VERSION.apk below, or in the app open Settings, Updates, Check for updates."
            echo "Checksum: KingShot-$VERSION.apk.sha256 (the app verifies it before installing)."
            echo "Built from commit $(git rev-parse HEAD). See CHANGELOG.md for what changed."
            echo "Not yet verified on every device; see docs/VALIDATION_LOG.md."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "KingShot-$VERSION.apk" "KingShot-$VERSION.apk.sha256" --clobber
            gh release edit "$TAG" --title "KingShot $VERSION" --notes-file notes.md --latest
          else
            gh release create "$TAG" "KingShot-$VERSION.apk" "KingShot-$VERSION.apk.sha256" --title "KingShot $VERSION" --notes-file notes.md
          fi
